# Versão com ATUALIZAÇÃO AUTOMÁTICA: usa a imagem pronta publicada no GitHub e um "vigia" (Watchtower)
# que, a cada 5 minutos, baixa a imagem nova e reinicia o sistema sozinho. Os dados (banco) são preservados.
#   docker compose -f docker-compose.auto.yml up -d
# Pré-requisito (uma vez): o pacote da imagem precisa ser público em
#   https://github.com/MayconMeneses?tab=packages  ->  sistema-de-clinica  ->  Package settings  ->  Change visibility -> Public
# Dados do sistema são FICTÍCIOS de demonstração; o banco fica no volume "pgdata".
services:
  db:
    image: postgres:16
    # Ajustes para rodar leve em computador comum (a demonstração tem poucos dados e poucos acessos simultâneos).
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=256MB", "-c", "wal_compression=on", "-c", "checkpoint_timeout=15min"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres        # só para demonstração local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: ghcr.io/mayconmeneses/sistema-de-clinica:latest
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      DEMO_SKIP_MASTER_MFA: "1"          # DEMONSTRAÇÃO: Master entra sem código MFA (a porta só abre neste computador). Nunca em produção: o sistema recusa iniciar.
      SEED_DEMO: "1"
      HOST_PORT: "${APP_PORT:-3010}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"   # alertas de erro por Telegram (docs/ALERTAS.md); vazio = desligado
      TELEGRAM_BOT_TOKEN_ENC: "${TELEGRAM_BOT_TOKEN_ENC:-}"   # alternativa cifrada ao token em claro (scripts/encrypt-secret.ts)
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      DATA_ENCRYPTION_KEY_PREVIOUS: "${DATA_ENCRYPTION_KEY_PREVIOUS:-}"   # só durante a troca de chave (docs/OPERACAO-CHAVES.md)
      TELEGRAM_CHAT_IDS: "${TELEGRAM_CHAT_IDS:-}"
      ALERTS_ENV_LABEL: "${ALERTS_ENV_LABEL:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"   # endereço público HTTPS (para o webhook do Mercado Pago); vazio = sem webhook
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"

  atualizador:
    image: nickfedor/watchtower:latest   # fork mantido do Watchtower (o original, containrrr, parou de funcionar com o Docker novo)
    restart: unless-stopped
    command: --label-enable --interval 300 --cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
