name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Banco de teste e papéis (sem BYPASSRLS)
        run: bash scripts/dev-db-setup.sh
      - name: "Migrations (aplica duas vezes - precisa ser idempotente)"
        run: npm run db:migrate && npm run db:migrate
      - name: Typecheck (servidor + web)
        run: npm run typecheck
      - name: Testes (PostgreSQL real)
        run: npm test
      - name: Build do frontend
        run: npm run build
      - name: Auditoria de dependências
        run: npm audit --audit-level=high
      - name: Varredura simples de segredos
        run: |
          if grep -rIE --exclude-dir=node_modules --exclude-dir=.git --exclude=package-lock.json -e '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -e 'AKIA[0-9A-Z]{16}' .; then
            echo "Possível segredo no repositório"; exit 1
          fi
      - name: Drill de backup/restore
        run: |
          npm run seed
          npm run drill
      - name: Backup cifrado (cifra, verifica, rejeita senha errada e adulteração, restaura)
        run: |
          export BACKUP_PASSPHRASE=frase-somente-do-ci-123 BACKUP_DIR="$RUNNER_TEMP/bk"
          f=$(bash scripts/backup-encrypted.sh backup | tail -1)
          if grep -q PGDMP "$f"; then echo "backup gravado em claro!"; exit 1; fi
          bash scripts/backup-encrypted.sh verify "$f"
          if BACKUP_PASSPHRASE=senha-errada-123456 bash scripts/backup-encrypted.sh verify "$f" 2>/dev/null; then echo "aceitou senha errada!"; exit 1; fi
          cp "$f" "$BACKUP_DIR/adulterado.dump.enc"; cp "$f.sha256" "$BACKUP_DIR/adulterado.dump.enc.sha256"
          sed -i "s/  .*/  adulterado.dump.enc/" "$BACKUP_DIR/adulterado.dump.enc.sha256"
          printf 'Z' | dd of="$BACKUP_DIR/adulterado.dump.enc" bs=1 seek=100 conv=notrunc 2>/dev/null
          if bash scripts/backup-encrypted.sh verify "$BACKUP_DIR/adulterado.dump.enc" 2>/dev/null; then echo "aceitou arquivo adulterado!"; exit 1; fi
          psql -q -d postgres -c "CREATE DATABASE clinica_bk_restore OWNER clinica_owner"
          bash scripts/backup-encrypted.sh restore "$f" clinica_bk_restore
          a=$(psql -tA -d clinica_one -c "select count(*) from patients"); b=$(psql -tA -d clinica_bk_restore -c "select count(*) from patients")
          echo "pacientes: origem=$a restaurado=$b"; [ "$a" = "$b" ]
      - name: Navegador (E2E em celular e desktop)
        run: |
          npx playwright-core install --with-deps chromium
          npm start &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/ready && break; sleep 1; done
          E2E_URL=http://127.0.0.1:3000 npm run e2e

  # Publica a imagem Docker só depois que tudo acima passou. O Watchtower (docker-compose.auto.yml) busca a nova imagem sozinho.
  publish:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/wizardly-carson-xuhql2')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mayconmeneses/sistema-de-clinica:latest
            ghcr.io/mayconmeneses/sistema-de-clinica:${{ github.sha }}
