# Sobe o banco (PostgreSQL 16) e o sistema com dados FICTÍCIOS de demonstração.
#   docker compose up --build
# Depois abra http://localhost:3010  (a porta pode ser mudada: APP_PORT=3020 docker compose up --build)
# (acessos: docs/ACESSO.md ou `docker compose logs app`)
services:
  db:
    image: postgres:16
    # Ajustes para rodar leve em computador comum (a demonstração tem poucos dados e poucos acessos simultâneos).
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=40", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=32MB", "-c", "effective_cache_size=256MB", "-c", "wal_compression=on", "-c", "checkpoint_timeout=15min"]
    environment:
      POSTGRES_PASSWORD: postgres        # só para demonstração local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      DEMO_SKIP_MASTER_MFA: "1"          # DEMONSTRAÇÃO: Master entra sem código MFA (a porta só abre neste computador). Nunca em produção: o sistema recusa iniciar.
      SEED_DEMO: "1"                     # "0" para não criar os dados de demonstração
      HOST_PORT: "${APP_PORT:-3010}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"   # endereço público HTTPS (para o webhook do Mercado Pago); vazio = sem webhook     # só para a mensagem de "Sistema no ar"
    ports:
      - "127.0.0.1:${APP_PORT:-3010}:3000"  # só este computador. Para abrir no celular na mesma rede, troque por "${APP_PORT:-3010}:3000"
                                         # (cuidado: qualquer pessoa da rede verá a tela de login com acessos de demonstração)
volumes:
  pgdata:
